<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Video Center</title>

<style>

body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#e8eef7,#dbe7f5);
    font-family:Arial,sans-serif;
}

.player{
    width:420px;
    background:white;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 10px 40px rgba(0,0,0,.15);
}

.header{
    background:white;
    padding:20px;
    text-align:center;
    border-bottom:1px solid #eee;
}

.logo{
    font-size:24px;
    font-weight:bold;
    color:#2b4eff;
    letter-spacing:1px;
}

.video-box{
    position:relative;
    width:100%;
    height:700px;
    overflow:hidden;
    background:#000;
}

#thumb{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.play{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:95px;
    height:95px;
    border-radius:50%;
    background:white;
    color:#2b4eff;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:46px;
    cursor:pointer;
    box-shadow:0 0 30px rgba(0,0,0,.25);
}

.play:hover{
    transform:translate(-50%,-50%) scale(1.08);
}

.badge{
    position:absolute;
    top:15px;
    left:15px;
    background:#2b4eff;
    color:white;
    padding:8px 14px;
    border-radius:30px;
    font-size:12px;
    font-weight:bold;
}

.footer{
    text-align:center;
    padding:20px;
}

.footer h3{
    margin:0;
    color:#222;
}

.footer p{
    color:#777;
    margin-top:8px;
}

</style>
</head>

<body>

<div class="player">

    <div class="header">
        <div class="logo">
            VIDEO CENTER
        </div>
    </div>

    <div class="video-box">

        <div class="badge">
            NEW VIDEO
        </div>

        <img id="thumb" src="">

        <div class="play" onclick="goVideo()">
            ▶
        </div>

    </div>

    <div class="footer">
        <h3>Contenido disponible</h3>
        <p>Presiona reproducir para continuar</p>
    </div>

</div>

<script>

let videoUrl = "";

fetch("videos.json")
.then(response => response.json())
.then(data => {

    const params = new URLSearchParams(window.location.search);

    const id = params.get("v") || "abc123";

    if(!data[id]){
        document.body.innerHTML =
        "<h1 style='font-family:Arial'>Video no encontrado</h1>";
        return;
    }

    document.getElementById("thumb").src =
    data[id].thumbnail;

    videoUrl =
    data[id].redirect;

});

function goVideo(){
    if(videoUrl){
        window.location.href = videoUrl;
    }
}

</script>

</body>
</html>
